version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldmesh
      POSTGRES_PASSWORD: fieldmesh
      POSTGRES_DB: fieldmesh
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
