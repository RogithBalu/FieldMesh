services:
  fieldmesh:
    build: .
    container_name: fieldmesh-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "1234:1234"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOCUSPOCUS_PORT=1234
      - DATABASE_URL=/data/fieldmesh.db
      - UPLOADS_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
